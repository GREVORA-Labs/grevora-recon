[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "grevora-recon"
version = "0.1.0"
description = "Scope-limited HTTP posture checks for authorized assets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []
[project.scripts]
grevora-recon = "grevora_recon.cli:main"
[tool.setuptools.packages.find]
include = ["grevora_recon*"]
